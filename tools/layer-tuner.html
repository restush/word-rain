<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Rain: Layer Tuner</title>
<style>
  :root{--cream:#FDF6E3;--teal:#1A535C;--sun:#FFD166;--bad:#9E1420}
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:flex;background:var(--cream);color:var(--teal);
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden}
  #left{flex:1;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}
  #stage-wrap{position:relative}
  #stage{position:relative;width:1024px;height:1024px;transform-origin:top left;
    background:#20343c;border:3px solid var(--teal);border-radius:8px}
  #stage img.layer{position:absolute;user-select:none;-webkit-user-drag:none;cursor:move}
  #stage img.layer.sel{outline:3px dashed var(--sun);outline-offset:2px}
  #right{width:330px;background:#fff;border-left:3px solid var(--teal);padding:12px;overflow:auto;font-size:13px}
  h2{font-size:14px;margin:12px 0 6px;text-transform:uppercase;letter-spacing:.5px}
  .row{display:flex;gap:6px;align-items:center;margin:5px 0}
  label{width:58px;font-weight:bold}
  input[type=number]{width:72px;padding:5px;border:2px solid var(--teal);border-radius:8px;font-size:13px}
  input[type=range]{flex:1}
  button{background:var(--teal);color:var(--cream);border:0;border-radius:10px;
    padding:8px 11px;font-weight:bold;cursor:pointer;font-family:inherit}
  button.alt{background:#fff;color:var(--teal);border:2px solid var(--teal)}
  button:hover{filter:brightness(1.12)}
  :focus-visible{outline:3px solid var(--bad);outline-offset:2px}
  .lay{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:8px;cursor:pointer}
  .lay.sel{background:var(--sun)}
  .lay .nm{flex:1;font-family:monospace;font-size:12px}
  .lay button{padding:2px 7px;font-size:11px;border-radius:6px}
  #coords{font-family:monospace;font-size:12px;background:var(--cream);
    border:2px solid var(--teal);border-radius:8px;padding:6px;margin:6px 0}
  #out{width:100%;height:130px;font-family:monospace;font-size:11px;
    border:2px solid var(--teal);border-radius:8px;padding:6px}
</style>
</head>
<body>
<div id="left"><div id="stage-wrap"><div id="stage"></div></div></div>
<div id="right">
  <h2>Word Rain: Layer Tuner</h2>
  <p>Pilih layer di daftar, lalu drag di gambar. Panah keyboard geser 1px (Shift = 10px). Rotate dan Flip untuk perbaiki miring.</p>
  <div class="row"><label>Zoom</label><input type="range" id="zoom" min="20" max="100" value="52"></div>
  <div id="coords">pilih layer dulu</div>
  <h2>Selected layer</h2>
  <div class="row"><label>X</label><input type="number" id="px"><label>Y</label><input type="number" id="py"></div>
  <div class="row"><label>Width</label><input type="number" id="pw"></div>
  <div class="row"><label>Rotate</label><input type="range" id="prot" min="-25" max="25" step="0.5" value="0"><input type="number" id="protv" step="0.5" value="0"></div>
  <div class="row"><label>Skew X</label><input type="range" id="pskx" min="-40" max="40" step="0.5" value="0"><input type="number" id="pskxv" step="0.5" value="0"></div>
  <div class="row"><label>Skew Y</label><input type="range" id="psky" min="-40" max="40" step="0.5" value="0"><input type="number" id="pskyv" step="0.5" value="0"></div>
  <div class="row"><label>Scale X</label><input type="range" id="pscx" min="0.3" max="2.5" step="0.01" value="1"><input type="number" id="pscxv" step="0.01" value="1"></div>
  <div class="row"><label>Scale Y</label><input type="range" id="pscy" min="0.3" max="2.5" step="0.01" value="1"><input type="number" id="pscyv" step="0.01" value="1"></div>
  <div class="row">
    <button class="alt" id="flip">Flip</button>
    <button class="alt" id="zup">Z up</button>
    <button class="alt" id="zdown">Z down</button>
  </div>
  <div class="row">
    <button class="alt" id="vbefore">View BEFORE</button>
    <button class="alt" id="vafter">View AFTER</button>
    <button class="alt" id="vall">View ALL</button>
  </div>
  <h2>Layers (grouped, top = front)</h2>
  <div id="list"></div>
  <h2>Input JSON (paste di sini, lalu Apply)</h2>
  <textarea id="in" placeholder="paste JSON"></textarea>
  <div class="row"><button id="apply">Apply JSON</button></div>
  <h2>Output for the assistant</h2>
  <textarea id="out" readonly></textarea>
  <div class="row">
    <button id="copy">Copy JSON</button>
    <button class="alt" id="save">Download slots.json</button>
    <button class="alt" id="reset">Reset</button>
  </div>
</div>
<script>
const ASSET = "../assets/";
const INIT = [
  ["old-wall",34,40,956,"before"],["old-floor",66,452,892,"before"],
  ["wall-paint",35,40,954,"after"],["floor-tiles",66,453,892,"after"],
  ["old-window",110,240,125,"before"],["blackboard",598,270,277,"before"],["old-fan",415,135,100,"before"],
  ["clock",705,150,60,"before"],["map",255,255,140,"before"],["bookshelf",240,435,175,"before"],
  ["desks",255,525,490,"both"],["teacher-desk",580,500,175,"both"],
  ["rugs",785,545,130,"before"],["plant",85,605,105,"before"],
  ["fix-window",110,240,125,"after"],["whiteboard",598,270,277,"after"],["ac",395,110,150,"after"],
  ["poster-map",255,255,140,"after"],["bookshelf-new",240,435,175,"after"],["rugs-new",785,545,130,"after"],
  ["plants-new",85,605,105,"after"],["curtains",105,225,135,"after"],
  ["tv",620,130,240,"after"],["kaligrafi",595,145,100,"after"],["flag",880,150,85,"after"],
  ["poster-english",115,500,115,"after"],["papan-karya",880,300,85,"after"]
];
function $(id){ return document.getElementById(id); }
const stage = document.getElementById("stage");
const layers = [];
let sel = null;

const shell = document.createElement("img");
shell.src = ASSET + "shell-base-cut.png";
shell.style.cssText = "position:absolute;left:0;top:0;width:1024px";
stage.appendChild(shell);

function place(st){
  st.el.style.left = st.x + "px";
  st.el.style.top = st.y + "px";
  st.el.style.width = st.w + "px";
  st.el.style.transform = "rotate(" + st.rot + "deg) skewX(" + st.skx + "deg) skewY(" +
    st.sky + "deg) scale(" + (st.flip ? -st.scx : st.scx) + "," + st.scy + ")";
  st.el.style.display = st.visible ? "" : "none";
}
function reorder(){ layers.forEach((st) => stage.appendChild(st.el)); }
function sync(){
  if (sel){
    $("px").value = sel.x; $("py").value = sel.y; $("pw").value = sel.w;
    $("prot").value = sel.rot; $("protv").value = sel.rot;
    $("coords").textContent = sel.name + "   x:" + sel.x + "  y:" + sel.y +
      "  w:" + sel.w + "  rot:" + sel.rot + "  skew:" + sel.skx + "/" + sel.sky +
      "  scale:" + sel.scx + "/" + sel.scy + (sel.flip ? "  flipped" : "");
    $("pskx").value = sel.skx; $("pskxv").value = sel.skx;
    $("psky").value = sel.sky; $("pskyv").value = sel.sky;
    $("pscx").value = sel.scx; $("pscxv").value = sel.scx;
    $("pscy").value = sel.scy; $("pscyv").value = sel.scy;
  }
  const out = {};
  layers.forEach((st) => {
    out[st.name] = {group: st.group, x: st.x, y: st.y, w: st.w, rot: st.rot, skx: st.skx, sky: st.sky,
      scx: st.scx, scy: st.scy, flip: st.flip, visible: st.visible};
  });
  $("out").value = JSON.stringify(out, null, 1);
}
function select(st){
  sel = st;
  layers.forEach((s) => s.el.classList.toggle("sel", s === sel));
  Array.prototype.forEach.call(document.querySelectorAll(".lay"), (r) =>
    r.classList.toggle("sel", r._st === sel));
  sync();
}
function buildList(){
  const list = $("list");
  list.innerHTML = "";
  [["before","BEFORE (kondisi awal)"],["both","SHARED (selalu tampil)"],["after","AFTER (renovasi)"]].forEach((g) => {
    const members = layers.filter((s) => s.group === g[0]);
    const head = document.createElement("div");
    head.className = "lay";
    head.style.fontWeight = "bold";
    const hcb = document.createElement("input");
    hcb.type = "checkbox";
    hcb.checked = members.every((s) => s.visible);
    hcb.addEventListener("change", () => {
      members.forEach((s) => { s.visible = hcb.checked; place(s); });
      buildList(); sync();
    });
    const hnm = document.createElement("span");
    hnm.className = "nm"; hnm.textContent = g[1];
    head.append(hcb, hnm);
    list.appendChild(head);
    members.slice().reverse().forEach((st) => {
      const row = document.createElement("div");
      row.className = "lay";
      row._st = st;
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = st.visible;
      cb.addEventListener("change", () => { st.visible = cb.checked; place(st); sync(); });
      const nm = document.createElement("span");
      nm.className = "nm"; nm.textContent = st.name;
      const up = document.createElement("button");
      up.textContent = "+"; up.title = "bring forward";
      up.addEventListener("click", (e) => { e.stopPropagation(); moveZ(st, 1); });
      const dn = document.createElement("button");
      dn.textContent = "-"; dn.title = "send backward";
      dn.addEventListener("click", (e) => { e.stopPropagation(); moveZ(st, -1); });
      row.append(cb, nm, up, dn);
      row.addEventListener("click", () => select(st));
      list.appendChild(row);
    });
  });
}
function moveZ(st, dir){
  const i = layers.indexOf(st);
  const j = i + dir;
  if (j < 0 || j >= layers.length) return;
  layers.splice(i, 1); layers.splice(j, 0, st);
  reorder(); buildList(); select(st);
}
function startDrag(e, st){
  select(st);
  const z = zoom();
  const sx = e.clientX, sy = e.clientY, ox = st.x, oy = st.y;
  function mv(ev){
    st.x = Math.round(ox + (ev.clientX - sx) / z);
    st.y = Math.round(oy + (ev.clientY - sy) / z);
    place(st); sync();
  }
  function up(){
    window.removeEventListener("pointermove", mv);
    window.removeEventListener("pointerup", up);
  }
  window.addEventListener("pointermove", mv);
  window.addEventListener("pointerup", up);
  e.preventDefault();
}
function zoom(){ return parseFloat($("zoom").value) / 100; }
function applyZoom(){
  const z = zoom();
  stage.style.transform = "scale(" + z + ")";
  $("stage-wrap").style.width = 1024 * z + "px";
  $("stage-wrap").style.height = 1024 * z + "px";
}
function init(){
  INIT.forEach((row) => {
    const name = row[0];
    const img = document.createElement("img");
    img.className = "layer";
    img.src = ASSET + name + "-cut.png";
    const st = {name: name, group: row[4], x: row[1], y: row[2], w: row[3], rot: 0, skx: 0, sky: 0,
      scx: 1, scy: 1, flip: false, visible: true, el: img};
    img.addEventListener("pointerdown", (e) => startDrag(e, st));
    stage.appendChild(img);
    layers.push(st);
    place(st);
  });
  buildList();
  applyZoom();
  sync();
}
$("zoom").addEventListener("input", applyZoom);
["px", "py", "pw"].forEach((id) => $(id).addEventListener("input", () => {
  if (!sel) return;
  sel.x = parseInt($("px").value) || 0;
  sel.y = parseInt($("py").value) || 0;
  sel.w = Math.max(10, parseInt($("pw").value) || 10);
  place(sel); sync();
}));
$("prot").addEventListener("input", () => {
  if (!sel) return;
  sel.rot = parseFloat($("prot").value) || 0;
  place(sel); sync();
});
[["prot","rot"],["pskx","skx"],["psky","sky"],["pscx","scx"],["pscy","scy"]].forEach((p) => {
  const sl = $(p[0]), nm = $(p[0] + "v");
  sl.addEventListener("input", () => {
    if (!sel) return;
    sel[p[1]] = parseFloat(sl.value) || 0;
    nm.value = sel[p[1]];
    place(sel); sync();
  });
  nm.addEventListener("change", () => {
    if (!sel) return;
    sel[p[1]] = parseFloat(nm.value) || 0;
    sl.value = sel[p[1]];
    place(sel); sync();
  });
});
$("flip").addEventListener("click", () => {
  if (!sel) return;
  sel.flip = !sel.flip; place(sel); sync();
});
$("zup").addEventListener("click", () => { if (sel) moveZ(sel, 1); });
$("zdown").addEventListener("click", () => { if (sel) moveZ(sel, -1); });
function setView(before, after){
  layers.forEach((st) => {
    st.visible = st.group === "both" ? true : (st.group === "before" ? before : after);
    place(st);
  });
  buildList(); sync();
}
$("vbefore").addEventListener("click", () => setView(true, false));
$("vafter").addEventListener("click", () => setView(false, true));
$("vall").addEventListener("click", () => setView(true, true));
$("copy").addEventListener("click", () => {
  const t = $("out");
  t.select();
  if (navigator.clipboard) navigator.clipboard.writeText(t.value);
  $("copy").textContent = "Copied!";
  setTimeout(() => { $("copy").textContent = "Copy JSON"; }, 1200);
});
$("save").addEventListener("click", () => {
  const blob = new Blob([$("out").value], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "slots.json";
  a.click();
});
$("apply").addEventListener("click", () => {
  let data;
  try { data = JSON.parse($("in").value); }
  catch (err) { $("coords").textContent = "JSON tidak valid"; return; }
  let n = 0;
  layers.forEach((st) => {
    const d = data[st.name];
    if (!d) return;
    if (typeof d.x === "number") st.x = d.x;
    if (typeof d.y === "number") st.y = d.y;
    if (typeof d.w === "number") st.w = d.w;
    if (typeof d.rot === "number") st.rot = d.rot;
    if (typeof d.skx === "number") st.skx = d.skx;
    if (typeof d.sky === "number") st.sky = d.sky;
    if (typeof d.scx === "number") st.scx = d.scx;
    if (typeof d.scy === "number") st.scy = d.scy;
    if (typeof d.flip === "boolean") st.flip = d.flip;
    if (typeof d.visible === "boolean") st.visible = d.visible;
    place(st);
    n++;
  });
  buildList(); sync();
  $("coords").textContent = "Applied " + n + " layers";
});
$("reset").addEventListener("click", () => location.reload());
document.addEventListener("keydown", (e) => {
  if (!sel) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea") return;
  const step = e.shiftKey ? 10 : 1;
  if (e.key === "ArrowLeft") sel.x -= step;
  else if (e.key === "ArrowRight") sel.x += step;
  else if (e.key === "ArrowUp") sel.y -= step;
  else if (e.key === "ArrowDown") sel.y += step;
  else return;
  e.preventDefault();
  place(sel); sync();
});
init();
</script>
</body>
</html>
